name: Bug report
description: Report a reproducible ChirpCue problem using synthetic data only.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include transcripts, credentials, auth output, private repository content, email addresses, or home-directory paths.
  - type: input
    id: version
    attributes:
      label: ChirpCue version
      placeholder: 0.2.4
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS and Mac model
      placeholder: macOS 26.x, Apple M-series
    validations:
      required: true
  - type: dropdown
    id: provider
    attributes:
      label: Provider path
      options:
        - Codex via ChatGPT
        - Claude via Claude.ai subscription
        - No provider involved
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Use synthetic content and redact personal paths.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: This report contains no real meeting content, credentials, auth links, private repository excerpts, email addresses, or absolute home paths.
          required: true
