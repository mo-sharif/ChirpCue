name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select Xcode
        run: sudo xcode-select --switch /Applications/Xcode.app/Contents/Developer
      - name: Lint, test, package, and verify
        run: |
          ./Scripts/lint.sh
          ./Scripts/test-hosted.sh
          ./Scripts/package-app.sh
          ./Scripts/verify-app.sh

  hosted-process-tests:
    runs-on: macos-26
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        suite:
          - PaceNoteCoreTests.CodexAppServerClientTests
          - PaceNoteCoreTests.CodexProcessTransportTests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select Xcode
        run: sudo xcode-select --switch /Applications/Xcode.app/Contents/Developer
      - name: Run isolated process suite
        run: ./Scripts/test-hosted-process-suite.sh '${{ matrix.suite }}'

  secret-scan:
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        run: brew install gitleaks
      - name: Scan full Git history
        run: ./Scripts/scan-secrets.sh
