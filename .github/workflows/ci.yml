name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select Xcode
        run: sudo xcode-select --switch /Applications/Xcode.app/Contents/Developer
      - name: Lint, test, package, and verify
        run: |
          ./Scripts/lint.sh
          ./Scripts/test-hosted.sh
          ./Scripts/package-app.sh
          ./Scripts/verify-app.sh

  hosted-process-tests:
    name: hosted-process-tests (${{ matrix.name }})
    runs-on: macos-26
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Codex app server
            filter: PaceNoteCoreTests.CodexAppServerClientTests
          - name: malformed protocol cleanup
            filter: PaceNoteCoreTests.CodexProcessTransportTests/testMalformedProtocolOutputTerminatesTheEntireProcessGroup
          - name: post-launch attestation
            filter: PaceNoteCoreTests.CodexProcessTransportTests/testPostLaunchAttestationFailsBeforeAnyProtocolInput
          - name: forced process termination
            filter: PaceNoteCoreTests.CodexProcessTransportTests/testStopEscalatesAfterTermIgnoringProcessAndReapsPID
          - name: descendant cleanup
            filter: PaceNoteCoreTests.CodexProcessTransportTests/testStopTerminatesDescendantsHoldingInheritedPipes
          - name: graceful process termination
            filter: PaceNoteCoreTests.CodexProcessTransportTests/testStopWaitsForGracefulProcessExitAndIsIdempotent
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select Xcode
        run: sudo xcode-select --switch /Applications/Xcode.app/Contents/Developer
      - name: Run isolated process suite
        run: ./Scripts/test-hosted-process-suite.sh '${{ matrix.filter }}'

  hosted-process-tests-complete:
    name: hosted-process-tests-complete
    if: always()
    needs: hosted-process-tests
    runs-on: ubuntu-latest
    steps:
      - name: Require every hosted process test
        env:
          MATRIX_RESULT: ${{ needs.hosted-process-tests.result }}
        run: test "$MATRIX_RESULT" = success

  secret-scan:
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        run: brew install gitleaks
      - name: Scan full Git history
        run: ./Scripts/scan-secrets.sh
